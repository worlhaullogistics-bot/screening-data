name: Refresh screening data
on:
  schedule: [{ cron: '23 11 * * *' }]   # every day, 4:23 AM Mountain
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl==3.1.5
      - run: python scripts/build.py data
      - name: Commit if changed
        run: |
          git config user.name "screening-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh lists $(date -u +%Y-%m-%d)"
          git push
